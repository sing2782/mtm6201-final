<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harvest Haven – Contact</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg" style="background: #a6bf5a;">
  <div class="container-fluid">

    <a class="navbar-brand fw-bold" href="index.html">HARVEST HAVEN</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Blog</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>

      <a href="contact.html" class="btn btn-outline-dark rounded-3 px-3 py-1 ms-lg-3">Book a Table</a>
    </div>

  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container py-4">

  <h1 class="fw-bold fs-2 mb-3">Contact & Reservations</h1>

  <!-- BOOK A TABLE -->
  <h3 class="fw-bold fs-5 mb-2">Book a Table</h3>

  <div class="card p-4 mb-4 text-white contact-card">

    <form>
      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" placeholder="Your name">
        </div>

        <div class="col-md-6">
          <label class="form-label">Date</label>
          <input type="date" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label">Party Size</label>
          <input type="number" min="1" class="form-control" placeholder="2">
        </div>

        <div class="col-md-6">
          <label class="form-label">Time</label>
          <input type="time" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="tel" class="form-control" placeholder="555-555-5555">
        </div>

        <div class="col-12 text-end">
          <button class="btn btn-dark">Reserve Now</button>
        </div>

      </div>
    </form>

  </div>

  <!-- EVENT INQUIRIES -->
  <h3 class="fw-bold fs-5 mb-2">Event Inquiries</h3>

  <div class="card p-4 mb-4 text-white contact-card">

    <form>
      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" placeholder="Your name">
        </div>

        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="tel" class="form-control" placeholder="555-555-5555">
        </div>

        <div class="col-md-6">
          <label class="form-label">Event Type</label>
          <input type="text" class="form-control" placeholder="Birthday, meeting...">
        </div>

        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="you@example.com">
        </div>

        <div class="col-12">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="4" placeholder="Tell us about your event"></textarea>
        </div>

        <div class="col-12 text-end">
          <button class="btn btn-dark">Submit Inquiry</button>
        </div>

      </div>
    </form>

  </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
